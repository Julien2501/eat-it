name = "eat-it-relay"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# Boîte de réception PRIVÉE : une issue par proposition (GitHub prévient par mail).
INBOX_REPO = "Julien2501/eat-it-propositions"
# Dépôt public de l'app : le relais y publie après validation.
PUBLISH_REPO = "Julien2501/eat-it"
ALLOWED_ORIGIN = "https://julien2501.github.io"

# Secrets (jamais écrits ici) : `npx wrangler secret put INBOX_TOKEN` et `npx wrangler secret put PUBLISH_TOKEN`.

# Stockage des photos et des propositions en attente.
[[kv_namespaces]]
binding = "IMAGES"
id = "f4213dc79f63419badf0191a69e924b4"
